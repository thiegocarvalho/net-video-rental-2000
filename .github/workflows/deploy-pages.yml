name: Deploy Net Video Rental 2000 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate i18n dictionaries (parity across pt-BR / en-GB / es-ES)
        run: node tools/check-i18n.mjs

      # O Pages serve tudo com max-age=600 e nao da para mudar o cabecalho. Sem isto, cada publicacao
      # tem 10 minutos servindo arquivo velho. Gera um import map versionado sobre a copia do artefato;
      # o index.html do repositorio nao muda e o desenvolvimento local segue sem etapa de build.
      - name: Stamp asset versions for cache busting
        run: node tools/stamp-cache.mjs

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
